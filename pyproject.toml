[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "data",
  "pytest-cache-files-*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008", # FastAPI intentionally uses Body/File/Query in endpoint defaults.
  "E501",
  "UP047", # Keep TypeVar syntax until mypy/pre-commit support for PEP 695 is consistently stable.
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
